services:
  # Vector Database & Relational Database for Legal Documents & Metadata
  db:
    image: pgvector/pgvector:pg16
    container_name: vn_tax_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Thieu POSTGRES_USER trong .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD trong .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Thieu POSTGRES_DB trong .env}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend FastAPI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vn_tax_backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3) as response:
              data = json.load(response)
          raise SystemExit(0 if data.get("status") == "ok" and data.get("database") is True else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      APP_ENV: "${APP_ENV:-dev}"
      CORS_ORIGINS: "${CORS_ORIGINS:?Thieu CORS_ORIGINS trong .env}"
    depends_on:
      db:
        condition: service_healthy

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vn_tax_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vn_tax_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vntax_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vntax_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vntax_copilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vn_tax_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vntax_admin:vntax_secret@db:5432/vntax_copilot
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vn_tax_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
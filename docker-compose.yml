version: '3.8'

services:
  # Vector Database & Relational Database for Legal Documents & Metadata
  db:
    image: pgvector/pgvector:pg16
    container_name: vn_tax_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vntax_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vntax_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vntax_copilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend FastAPI Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vn_tax_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vntax_admin}:${POSTGRES_PASSWORD:-vntax_secret}@db:5432/${POSTGRES_DB:-vntax_copilot}
      # Token thử nghiệm (token:user:tenant). Thiếu thì mọi API trả 401. Staging: đặt biến AUTH_TOKENS riêng.
      AUTH_TOKENS: ${AUTH_TOKENS:-dev-token-alice-0001:alice:thtax,dev-token-bob-0002:bob:other}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      - db

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vn_tax_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

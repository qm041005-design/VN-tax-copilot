# Standalone test stack. Does not use the demo DB, pgdata or host DB port.
services:
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: vntax_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_user -d vntax_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    init: true
    environment:
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@db-test:5432/vntax_test
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./artifacts:/workspace/artifacts

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: PostgreSQL, PO, OCR and QA tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: vntax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d vntax_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/vntax_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vietnamese OCR and test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng fonts-dejavu-core
      - name: Install integrated dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Run all tests and public-source HTTP smoke
        run: python scripts/ci.py
      - name: Upload test results and API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/
          if-no-files-found: warn

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_DEV_API_TOKEN: ci-smoke-token-0001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Docker Compose fresh install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate demo and test Compose files
        run: |
          docker compose --env-file .env.example -p scrum28-ci config --quiet
          docker compose -p scrum28-tests -f compose.test.yml config --quiet
      - name: Build and wait for db, backend and frontend
        run: docker compose --env-file .env.example -p scrum28-ci up -d --build --wait --wait-timeout 180
      - name: Exercise demo backup, restore and repeated migration
        run: |
          docker compose --env-file .env.example -p scrum28-ci exec -T -e SMOKE_API_TOKEN=dev-token-alice-0001 backend python scripts/smoke_public_source.py --confirm-test-database vntax_copilot
          docker compose --env-file .env.example -p scrum28-ci cp scripts/db-maintenance.sh db:/tmp/db-maintenance.sh
          docker compose --env-file .env.example -p scrum28-ci exec -T db mkdir -p /tmp/migrations
          docker compose --env-file .env.example -p scrum28-ci cp backend/migrations/. db:/tmp/migrations/
          mkdir -p artifacts
          docker compose --env-file .env.example -p scrum28-ci stop frontend backend
          docker compose --env-file .env.example -p scrum28-ci exec -T db sh /tmp/db-maintenance.sh inspect > artifacts/before-restore.json
          docker compose --env-file .env.example -p scrum28-ci exec -T db sh /tmp/db-maintenance.sh backup /tmp/demo.dump
          docker compose --env-file .env.example -p scrum28-ci exec -T db sh /tmp/db-maintenance.sh restore /tmp/demo.dump vntax_restore_ci
          docker compose --env-file .env.example -p scrum28-ci exec -T -e POSTGRES_DB=vntax_restore_ci db sh /tmp/db-maintenance.sh migrate /tmp/migrations
          docker compose --env-file .env.example -p scrum28-ci exec -T -e POSTGRES_DB=vntax_restore_ci db sh /tmp/db-maintenance.sh migrate /tmp/migrations
          docker compose --env-file .env.example -p scrum28-ci exec -T -e POSTGRES_DB=vntax_restore_ci db sh /tmp/db-maintenance.sh inspect > artifacts/after-restore.json
          diff -u artifacts/before-restore.json artifacts/after-restore.json
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose --env-file .env.example -p scrum28-ci ps -a > artifacts/compose-status.txt
          docker compose --env-file .env.example -p scrum28-ci logs --no-color > artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-results
          path: artifacts/
      - name: Remove disposable CI stack
        if: always()
        run: docker compose --env-file .env.example -p scrum28-ci down -v

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend PostgreSQL and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: vntax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d vntax_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/vntax_test
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/vntax_test
      AUTH_TOKENS: ci-smoke-token-0001:ci:thtax
      SMOKE_API_TOKEN: ci-smoke-token-0001
      PYTHONPATH: .:backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
      - name: Public-source parser to PostgreSQL to HTTP API
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/api.log"; exit 1; fi
          python backend/scripts/smoke_public_source.py --confirm-test-database vntax_test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
